# Weekly `bundle update --all`. Dependabot only bumps *direct* gems (plus
# whatever's needed to satisfy a direct update or a security fix); it never
# updates a transitive-only gem just because a newer release exists. This job
# re-resolves the whole lockfile the way running `bundle update --all` locally
# does, and opens a PR with the result.
name: "Bundle update"

on:
  schedule:
    # Weekly, Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  bundle-update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9  # v1.316.0
        with:
          bundler-cache: true
      - name: Update all gems
        run: bundle update --all
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          # GITHUB_TOKEN works, but PRs it opens do NOT trigger the CI workflow.
          # Set a GH_PAT secret (repo-scoped PAT) to get tests/lint to run on the
          # update PR; it falls back to GITHUB_TOKEN when GH_PAT is absent.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "bundle: bundle update --all"
          branch: "automated/bundle-update"
          delete-branch: true
          title: "bundle: weekly bundle update --all"
          body: |
            Automated `bundle update --all` run.

            Re-resolves the entire `Gemfile.lock` to the newest versions allowed
            by the `Gemfile`, including transitive dependencies that Dependabot's
            version updates leave behind.
          labels: "dependencies"
